    <meta name="application-name" content="Leafia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded off the render path on purpose. Chrome refuses to execute
         scripts while a stylesheet is still pending, so a font host that
         HANGS — dropped packets rather than a refusal, which is what a
         filtered network does — leaves the entire app a blank page: the
         module graph never runs and React never mounts. `media="print"` keeps
         the sheet out of the critical path, `onload` promotes it to `all` if
         and when it actually arrives, and if it never arrives the app renders
         in the fallback faces instead of not rendering at all. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Leafia</title>
    <style>
      /* Boot shell. Painted from this inline block before the JS bundle
         arrives, in the intro curtain's palette and motifs, so a cold load
         shows the room's light instead of a white page. main.tsx lifts it
         once React has taken over. Zero requests, system-font stack, no
         dependency on anything below this point. */
      html {
        background: #f4e2e8;
      }

      #boot-shell {
        position: fixed;
        z-index: 400;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 73% 48%,
            rgba(255, 255, 255, 0.56),
            transparent 32%
          ),
          linear-gradient(122deg, #fbf5ef 0%, #f4e2e8 45%, #e8dfed 100%);
        color: #342c36;
        opacity: 1;
        transition: opacity 380ms ease;
        pointer-events: none;
      }

      #boot-shell.is-dismissed {
        opacity: 0;
      }

      #boot-shell .boot-shell__staff {
        position: absolute;
        top: 24%;
        right: 4%;
        width: 48%;
        transform: rotate(-3deg);
      }

      #boot-shell .boot-shell__staff i {
        display: block;
        height: 1px;
        margin-bottom: 34px;
        background: linear-gradient(
          90deg,
          rgba(105, 73, 87, 0),
          rgba(105, 73, 87, 0.18) 18%,
          rgba(105, 73, 87, 0.12) 82%,
          transparent
        );
      }

      #boot-shell .boot-shell__note {
        color: #a9677b;
        font: 400 clamp(44px, 4.6vw, 76px) / 1 Georgia, serif;
        text-shadow: 0 14px 30px rgba(130, 78, 98, 0.16);
      }

      #boot-shell .boot-shell__mark {
        color: #342c36;
        font: 400 clamp(26px, 4.4vw, 44px) / 1 Georgia, "Times New Roman",
          serif;
        letter-spacing: 0.34em;
        margin-left: 0.34em; /* recentre against the trailing letter-space */
        text-indent: 0;
        white-space: nowrap;
      }

      #boot-shell .boot-shell__tagline {
        color: #a15e73;
        font: italic 400 15px/1.2 Georgia, "Times New Roman", serif;
      }

      #boot-shell .boot-shell__wait {
        display: inline-flex;
        gap: 7px;
        margin-top: 2px;
      }

      #boot-shell .boot-shell__wait i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #a9677b;
        animation: boot-shell-dot 1.3s ease-in-out infinite;
      }

      #boot-shell .boot-shell__wait i:nth-child(2) {
        animation-delay: 0.18s;
      }

      #boot-shell .boot-shell__wait i:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes boot-shell-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }

        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell {
          transition: none;
        }

        #boot-shell .boot-shell__wait i {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DZDOFZSG.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-m49-800k.css">
  </head>
  <body>
    <div id="boot-shell" aria-hidden="true">
      <div class="boot-shell__staff">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </div>
      <span class="boot-shell__note">♪</span>
      <strong class="boot-shell__mark">LEAFIA</strong>
      <em class="boot-shell__tagline">a moonlit knowledge space</em>
      <span class="boot-shell__wait">
        <i></i>
        <i></i>
        <i></i>
      </span>
    </div>
    <div id="root"></div>
  </body>
</html>
